<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>矿经缘 · 下载</title>
    <link rel="icon" href="./website_icon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./theme.css">
    <script>
        // 主题初始化：优先读记忆，默认浅色（放在 head 里避免闪烁）
        (function () {
            var saved = localStorage.getItem('kicoso-theme');
            document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <style>
        /* 本页专属：矿经缘下载页（主题令牌配色） */
        .mine-container {
            max-width: 600px;
            width: calc(100% - 40px);
            margin: 40px auto;
            padding: 30px;
            background: var(--panel-bg);
            border: var(--panel-border);
            border-radius: var(--radius-panel);
            box-shadow: var(--panel-shadow);
        }

        .title-area {
            text-align: center;
            padding: 30px 20px 26px;
            border-bottom: var(--section-border);
            margin-bottom: 40px;
            position: relative;
        }

        .title {
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--h1-color);
            letter-spacing: 10px;
            margin-bottom: 8px;
        }

        .title span {
            color: var(--h1-span);
        }

        html[data-theme="dark"] .title span {
            color: var(--accent-a);
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            letter-spacing: 6px;
        }

        .download-zone {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 30px;
        }

        .download-zone .download-btn {
            display: block;
            text-align: center;
            padding: 22px;
            font-size: 1.1rem;
            letter-spacing: 4px;
        }

        .footer-text {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 4px;
            margin-top: 50px;
        }

        @media (max-width: 700px) {
            .title { font-size: 2rem; letter-spacing: 6px; }
            .subtitle { font-size: 0.85rem; letter-spacing: 4px; }
            .download-zone .download-btn { padding: 18px; font-size: 0.95rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="logo">
            <img src="./kicoso.png" alt="Kicoso Logo">
            <span class="logo-text logo-text-default">kicoso</span>
            <span class="logo-text logo-text-shrink">Kicoso Studios</span>
        </div>
        <nav>
            <ul>
                <li><a href="./index.html">首页</a></li>
                <li><a href="./products.html">我们的产品</a></li>
            </ul>
            <a href="#" id="themeToggle" class="btn theme-btn">
                <span class="t-dark"><i class="fas fa-moon"></i> 深色</span>
                <span class="t-light"><i class="fas fa-sun"></i> 浅色</span>
            </a>
        </nav>
    </header>

    <div class="mine-container">
        <div class="title-area">
            <div class="title"><span>矿经缘</span></div>
            <div class="subtitle">O R E T O R S T</div>
        </div>

        <div class="download-zone">
            <a href="https://wwbak.lanzoub.com/iTbus4cappli" class="download-btn" target="_blank" rel="noopener">下载-密码7c5f</a>
        </div>

        <div class="footer-text">KICOSO STUDIOS</div>
    </div>

    <footer class="footer-bar">
        <div class="footer-content">
            <a href="https://github.com/LrcxzzMC/lrcxzzmc.github.io" target="_blank" class="github-link">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" class="github-icon">
                <span>源码</span>
            </a>
        </div>
    </footer>

    <div class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </div>

    <script>
        // 主题切换：只翻转 data-theme，样式全在 theme.css 里
        document.getElementById('themeToggle').addEventListener('click', function (e) {
            e.preventDefault();
            var root = document.documentElement;
            var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            localStorage.setItem('kicoso-theme', next);
        });

        // 滚动：顶栏收缩 + 回到顶部
        window.addEventListener('scroll', function () {
            var header = document.getElementById('header');
            var backToTop = document.getElementById('backToTop');
            header.classList.toggle('shrink', window.scrollY > 80);
            backToTop.classList.toggle('visible', window.scrollY > 400);
        });

        document.getElementById('backToTop').addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

</body>
</html>
