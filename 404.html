<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>此界面死了</title>
    <link rel="icon" href="https://www.microsoft.com/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        /* ===== 星空背景 ===== */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .content {
            padding: 20px;
            position: relative;
            z-index: 10;
            user-select: none;
        }

        /* ===== 版权信息 ===== */
        .copyright {
            font-size: 20px;
            color: #ccff33;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            text-shadow: 0 0 20px rgba(204, 255, 51, 0.15);
        }

        /* ===== 404 行：两边放 Logo ===== */
        .error-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 0px;
            flex-wrap: wrap;
        }

        .error-row .logo-icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            transition: transform 0.3s;
            pointer-events: none;
        }

        .error-row .logo-icon:hover {
            transform: scale(1.1) rotate(-5deg);
        }

        /* ===== 滚动彩虹 404 ===== */
        .big-404 {
            font-size: 160px;
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: 10px;
            flex-shrink: 0;
            background: linear-gradient(90deg, #ff0000, #ff7700, #ffff00, #00ff00, #0000ff, #8b00ff, #ff0000);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbowRoll 3s linear infinite;
            text-shadow: none;
        }

        @keyframes rainbowRoll {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        /* ===== 💩 样式（可点击） ===== */
        .big-poop {
            font-size: 160px;
            line-height: 1.2;
            display: inline-block;
            margin-top: -10px;
            cursor: pointer;
            transition: transform 0.15s;
            position: relative;
            animation: float 3s ease-in-out infinite;
            user-select: none;
        }

        .big-poop:hover {
            transform: scale(1.1);
        }

        .big-poop:active {
            transform: scale(0.9);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }

        /* ===== 小大便粒子容器 ===== */
        #poopContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .mini-poop {
            position: absolute;
            font-size: 20px;
            pointer-events: none;
            animation: flyOut 3.5s ease-out forwards;
        }

        @keyframes flyOut {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.1) rotate(720deg);
            }
        }

        .sub-text {
            font-size: 28px;
            color: #ccc;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .sub-text-2 {
            font-size: 20px;
            color: #888;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        /* ===== 底部链接 ===== */
        .footer-links {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #7a9eff;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .footer-links a:hover {
            color: #ff7eb9;
            background: rgba(255, 126, 185, 0.1);
            transform: scale(1.05);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .copyright { font-size: 14px; }
            .error-row { gap: 10px; }
            .error-row .logo-icon { width: 45px; height: 45px; }
            .big-404 { font-size: 80px; letter-spacing: 5px; }
            .big-poop { font-size: 90px; }
            .sub-text { font-size: 20px; }
            .sub-text-2 { font-size: 16px; }
            .footer-links { gap: 20px; }
            .footer-links a { font-size: 16px; }
        }

        @media (max-width: 400px) {
            .error-row .logo-icon { width: 30px; height: 30px; }
            .big-404 { font-size: 55px; }
            .copyright { font-size: 11px; }
            .big-poop { font-size: 60px; }
        }
    </style>
</head>
<body>

    <!-- ===== 星空背景 Canvas ===== -->
    <canvas id="starCanvas"></canvas>

    <!-- ===== 小大便容器 ===== -->
    <div id="poopContainer"></div>

    <!-- ===== 主内容 ===== -->
    <div class="content">
        <div class="copyright">(𝓒) 2026 𝓚𝓘𝓒𝓞𝓢𝓞 𝓢𝓣𝓤𝓓𝓘𝓞𝓢</div>

        <div class="error-row">
            <img src="./kicoso.png" alt="Kicoso Logo" class="logo-icon">
            <span class="big-404">404</span>
            <img src="./kicoso.png" alt="Kicoso Logo" class="logo-icon">
        </div>

        <!-- 💩 点击触发爆炸 -->
        <div class="big-poop" id="bigPoop">💩</div>

        <div class="sub-text">你动了屎山项目，该页面死了</div>
        <div class="sub-text-2">ksc水滴无法为你定位网页</div>

        <div class="footer-links">
            <a href="./index.html">🏠 回到首页</a>
            <a href="https://www.bilibili.com/video/BV1GJ411x7h7" target="_blank">❓ 寻求帮助</a>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 星空背景：无限滚动 + 随机抖动
        // ============================================================
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        const STAR_COUNT = 180;

        // 先设置 canvas 尺寸，再生成星星
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas(); // 立即执行一次
        window.addEventListener('resize', function() {
            resizeCanvas();
            // 窗口变化时，把星星重新分布到全屏
            stars.forEach(star => {
                star.x = Math.random() * canvas.width;
                star.y = Math.random() * canvas.height;
            });
        });

        // 星星类
        class Star {
            constructor(init = true) {
                this.x = Math.random() * canvas.width;
                if (init) {
                    this.y = Math.random() * canvas.height;
                } else {
                    this.y = -5 - Math.random() * 20;
                }
                this.size = 0.8 + Math.random() * 2.5;
                this.speed = 0.3 + Math.random() * 0.8;
                this.opacity = 0.3 + Math.random() * 0.7;
                this.shakeX = 0;
                this.shakeY = 0;
                this.shakeSpeed = 0.02 + Math.random() * 0.04;
                this.shakeAngle = Math.random() * Math.PI * 2;
                this.shakeAmplitude = 0.3 + Math.random() * 0.8;
                this.twinkleSpeed = 0.005 + Math.random() * 0.015;
                this.twinkleOffset = Math.random() * Math.PI * 2;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -5 - Math.random() * 20;
                this.size = 0.8 + Math.random() * 2.5;
                this.speed = 0.3 + Math.random() * 0.8;
                this.opacity = 0.3 + Math.random() * 0.7;
                this.shakeAmplitude = 0.3 + Math.random() * 0.8;
            }

            update() {
                this.y += this.speed;

                this.shakeAngle += this.shakeSpeed;
                this.shakeX = Math.cos(this.shakeAngle) * this.shakeAmplitude;
                this.shakeY = Math.sin(this.shakeAngle * 0.7 + 0.5) * this.shakeAmplitude * 0.6;

                this.currentOpacity = this.opacity * (0.6 + 0.4 * Math.sin(Date.now() * this.twinkleSpeed + this.twinkleOffset));

                if (this.y > canvas.height + 10) {
                    this.reset();
                }
            }

            draw() {
                const drawX = this.x + this.shakeX;
                const drawY = this.y + this.shakeY;

                ctx.beginPath();
                ctx.arc(drawX, drawY, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.currentOpacity})`;
                ctx.fill();

                if (this.size > 1.8) {
                    ctx.shadowColor = `rgba(200, 220, 255, ${this.currentOpacity * 0.3})`;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }

        // 创建星星：初始化时全屏均匀分布
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star(true));
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animateStars);
        }

        animateStars();

        // ============================================================
        // 2. 💩 点击爆炸：飞出 140 个小大便
        // ============================================================
        const bigPoop = document.getElementById('bigPoop');
        const container = document.getElementById('poopContainer');

        bigPoop.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            this.style.opacity = '0';
            this.style.transition = 'opacity 0.15s';
            setTimeout(() => {
                this.style.opacity = '1';
            }, 2200);

            const count = 140;
            const radius = 700;

            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const distance = radius + Math.random() * 300;

                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                const el = document.createElement('span');
                el.className = 'mini-poop';
                el.textContent = '💩';
                el.style.left = cx + 'px';
                el.style.top = cy + 'px';
                el.style.fontSize = (28 + Math.random() * 22) + 'px';
                el.style.setProperty('--tx', tx + 'px');
                el.style.setProperty('--ty', ty + 'px');
                el.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
                el.style.animationDelay = (Math.random() * 0.3) + 's';

                container.appendChild(el);

                setTimeout(() => {
                    el.remove();
                }, 4500);
            }
        });

        // ============================================================
        // 3. 控制台彩蛋
        // ============================================================
        console.log('%c💩 别看了，全是屎山！', 'font-size: 30px; color: #ccff33;');
        console.log('%cKicoso Studio 2026', 'font-size: 16px; color: #888;');
        console.log('%c你动了屎山项目，该页面死了', 'font-size: 14px; color: #ff6b6b;');

        // ============================================================
        // 4. 按 4 键跳转到 2024ksc.html
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === '4') {
                window.location.href = './2024ksc.html';
            }
        });
    </script>

</body>
</html>
