<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的产品 - Kicoso</title>
    <link rel="icon" href="./webside_icon.png" type="image/png">
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('./font.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'CustomFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: url('./bg.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #555;
            line-height: 1.6;
            padding-top: 80px;
            min-height: 100vh;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 250, 245, 0.95);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            padding: 15px 5%;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        header.shrink {
            padding: 8px 5%;
            background-color: rgba(255, 253, 252, 0.98);
        }

        .logo {
            display: flex;
            align-items: center;
            margin-right: 40px;
            transition: all 0.3s ease;
        }

        .logo img {
            height: 50px;
            width: auto;
            transition: all 0.3s ease;
        }

        header.shrink .logo img {
            opacity: 0;
            width: 0;
            height: 0;
            margin: 0;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 600;
            color: #ff7eb9;
            transition: all 0.3s ease;
            margin-left: 12px;
        }

        .logo-text-default {
            display: inline-block;
        }
        .logo-text-shrink {
            display: none;
        }

        header.shrink .logo-text-default {
            display: none;
        }
        header.shrink .logo-text-shrink {
            display: inline-block;
            margin-left: 0;
            font-size: 22px;
            font-weight: 600;
            color: #ff7eb9;
        }

        header.shrink .logo {
            margin-right: 20px;
        }

        nav {
            flex-grow: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: #5a7d9a;
            font-weight: 500;
            font-size: 18px;
            padding: 8px 12px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        nav ul li a:hover {
            background-color: rgba(255, 126, 185, 0.1);
            color: #ff7eb9;
        }

        .btn {
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            padding: 8px 14px;
            border-radius: 20px;
            transition: all 0.3s ease;
            border: 1px solid #e0d6d6;
            background: rgba(255, 255, 255, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .kol-btn {
            color: #5a7d9a;
        }

        .kol-btn:hover {
            background-color: rgba(255, 126, 185, 0.1);
            color: #ff7eb9;
            border-color: #ff7eb9;
        }

        .theme-btn {
            color: #5a7d9a;
        }

        .theme-btn:hover {
            background-color: rgba(122, 158, 255, 0.1);
            color: #7a9eff;
            border-color: #7a9eff;
        }

        .products-content {
            max-width: 1200px;
            margin: 40px auto;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .products-content h1 {
            text-align: center;
            color: #ff7eb9;
            font-size: 2.8rem;
            margin-bottom: 40px;
        }

        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            justify-items: center;
        }

        .product-card {
            background: linear-gradient(135deg, #f8f9ff 0%, #fef2fb 100%);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
            width: 100%;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-icon {
            font-size: 50px;
            margin-bottom: 20px;
            color: #7a9eff;
        }

        .product-card h3 {
            color: #5a7d9a;
            margin-bottom: 15px;
        }

        .product-card p {
            margin-bottom: 20px;
            color: #777;
        }

        .download-btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(45deg, #7a9eff, #38cbd8);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            box-shadow: 0 5px 15px rgba(58, 203, 216, 0.4);
        }

        .footer-bar {
            background-color: #000;
            color: white;
            padding: 15px 0;
            text-align: left;
            width: 100%;
            margin-top: 40px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .github-link:hover {
            color: #ff7eb9;
            transform: translateX(5px);
        }

        .github-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            filter: invert(1);
            transition: all 0.3s ease;
        }

        .github-link:hover .github-icon {
            filter: invert(0.5) sepia(1) saturate(5) hue-rotate(300deg);
        }

        @media (max-width: 768px) {
            header {
                padding: 12px 5%;
            }

            .logo-text {
                font-size: 20px;
            }

            nav ul li {
                margin-left: 15px;
            }

            nav ul li a {
                font-size: 16px;
            }

            .btn {
                font-size: 14px;
                padding: 6px 12px;
            }

            header.shrink .logo-text-shrink {
                font-size: 16px;
            }

            nav {
                gap: 8px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .products-content {
                padding: 20px 16px;
                margin: 20px 12px;
            }

            .products-content h1 {
                font-size: 2rem;
            }

            .products-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .product-card {
                padding: 20px 16px;
            }
        }

        @media (max-width: 480px) {
            .logo img {
                height: 32px;
            }

            .logo-text {
                font-size: 16px;
                margin-left: 8px;
            }

            .products-content h1 {
                font-size: 1.6rem;
            }

            nav ul li a {
                font-size: 14px;
                padding: 4px 10px;
            }

            .btn {
                font-size: 12px;
                padding: 4px 10px;
            }

            header.shrink .logo-text-shrink {
                font-size: 14px;
            }

            .product-card {
                padding: 16px 12px;
            }

            .download-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="logo">
            <img src="./kicoso.png" alt="Kicoso Logo">
            <span class="logo-text logo-text-default">kicoso</span>
            <span class="logo-text logo-text-shrink">Kicoso Studios</span>
        </div>
        <nav>
            <ul>
                <li><a href="./index.html">首页</a></li>
                <li><a href="./about.html">关于</a></li>
            </ul>
            <a href="./kol.html" class="btn kol-btn">📄 协议</a>
            <a href="./products_d.html" class="btn theme-btn">🌙 深色</a>
        </nav>
    </header>

    <div class="products-content">
        <h1>我们的产品</h1>

        <div class="products-container">
            <div class="product-card">
                <div class="product-icon">O</div>
                <h3>OdiyaOS</h3>
                <p>一款永远不会停更的"操作系统-伪"</p>
                <a href="odiya.html" class="download-btn">版本</a>
            </div>
            <div class="product-card">
                <div class="product-icon">⛏️</div>
                <h3>矿经缘 - Oretorst</h3>
                <p>挖矿模拟经营游戏</p>
                <a href="./oretorst.html" class="download-btn">查看</a>
            </div>
            <div class="product-card">
                <div class="product-icon">🎮️</div>
                <h3>WabLian World-万联世界</h3>
                <p>MC的多方面整合包</p>
                <a href="./wwlMC.html" class="download-btn">下载整合包，拖入pcl等启动器即可安装，对网络要求高</a>
            </div>

            <div class="product-card">
                <div class="product-icon">🎮️</div>
                <h3>各种模组</h3>
                <p>kcs的所有模组都在这里！</p>
                <a href="./MODS.html" class="download-btn">？？？</a>
            </div>
        </div>
    </div>

    <footer class="footer-bar">
        <div class="footer-content">
            <a href="https://github.com/LrcxzzMC/lrcxzzmc.github.io" target="_blank" class="github-link">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" class="github-icon">
                <span>源码</span>
            </a>
        </div>
    </footer>

    <script>
        window.addEventListener('scroll', function() {
            const header = document.getElementById('header');
            if (window.scrollY > 100) {
                header.classList.add('shrink');
            } else {
                header.classList.remove('shrink');
            }
        });
    </script>

</body>
</html>
