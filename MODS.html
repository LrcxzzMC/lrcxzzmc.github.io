<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模组列表 · Kicoso</title>
    <link rel="icon" href="./website_icon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./theme.css">
    <script>
        // 主题初始化：优先读记忆，默认浅色（放在 head 里避免闪烁）
        (function () {
            var saved = localStorage.getItem('kicoso-theme');
            document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <style>
        /* 本页专属：像素风模组列表（等宽字体 + 主题令牌配色） */
        @font-face {
            font-family: 'PixelFont';
            src: url('./font.ttf') format('truetype');
        }

        * {
            font-family: 'PixelFont', 'Courier New', monospace;
        }

        .mods-container {
            max-width: 780px;
            width: calc(100% - 40px);
            margin: 40px auto;
            padding: 30px;
            background: var(--panel-bg);
            border: var(--panel-border);
            border-radius: var(--radius-panel);
            box-shadow: var(--panel-shadow);
        }

        .mods-header {
            text-align: center;
            padding: 24px 0 20px;
            border-bottom: var(--section-border);
            margin-bottom: 30px;
        }

        .mods-header h1 {
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--h1-color);
            letter-spacing: 4px;
        }

        .mods-header h1 span {
            color: var(--h1-span);
        }

        html[data-theme="dark"] .mods-header h1 span {
            color: var(--accent-a);
        }

        .mods-header .sub {
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 4px;
            margin-top: 4px;
        }

        .mod-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            margin-bottom: 8px;
            background: var(--card-bg);
            border: var(--card-border);
            border-radius: var(--radius-card);
            transition: all 0.3s ease;
        }

        .mod-item:hover {
            background: var(--card-hover-bg);
            transform: translateX(4px);
        }

        html:not([data-theme="dark"]) .mod-item:nth-child(3n+1):hover {
            border-color: var(--accent);
        }

        html:not([data-theme="dark"]) .mod-item:nth-child(3n+2):hover {
            border-color: var(--accent-orange);
        }

        html:not([data-theme="dark"]) .mod-item:nth-child(3n):hover {
            border-color: var(--accent-green);
        }

        html[data-theme="dark"] .mod-item:hover {
            border-color: #ffffff;
        }

        .mod-item .name {
            color: var(--text);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .mod-item .name .tag {
            color: var(--muted);
            font-size: 0.6rem;
            margin-left: 8px;
            border: 1px solid var(--btn-border);
            border-radius: var(--radius-pill);
            padding: 1px 8px;
        }

        .mod-item .download-link {
            color: var(--btn-color);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 4px 16px;
            border: 1px solid var(--btn-border);
            border-radius: var(--radius-pill);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .mod-item .download-link:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        html[data-theme="dark"] .mod-item .download-link:hover {
            color: var(--accent-b);
            border-color: var(--accent-b);
        }

        @media (max-width: 600px) {
            .mod-item {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
                text-align: center;
            }
            .mods-header h1 { font-size: 1.6rem; letter-spacing: 2px; }
            .mod-item .name { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="logo">
            <img src="./kicoso.png" alt="Kicoso Logo">
            <span class="logo-text logo-text-default">kicoso</span>
            <span class="logo-text logo-text-shrink">Kicoso Studios</span>
        </div>
        <nav>
            <ul>
                <li><a href="./index.html">首页</a></li>
                <li><a href="./products.html">我们的产品</a></li>
            </ul>
            <a href="#" id="themeToggle" class="btn theme-btn">
                <span class="t-dark"><i class="fas fa-moon"></i> 深色</span>
                <span class="t-light"><i class="fas fa-sun"></i> 浅色</span>
            </a>
        </nav>
    </header>

    <div class="mods-container">
        <div class="mods-header">
            <h1><span>MODS</span></h1>
            <div class="sub">// Kicoso 模组仓库</div>
        </div>

        <div class="mod-item">
            <span class="name">WWIII-二战物品模组 <span class="tag">模组</span></span>
            <a href="https://bbsmc.net/mod/wwii-items" class="download-link">查看</a>
        </div>
        <div class="mod-item">
            <span class="name">森罗附属-老牌酒馆 <span class="tag">版本列表</span></span>
            <a href="./kaletaold.html" class="download-link">进入</a>
        </div>
        <div class="mod-item">
            <span class="name">机械动力 · 轨道无限制 <span class="tag">模组</span></span>
            <a href="https://github.com/LrcxzzMC/Fcr/releases/download/Release1.0.0/free_creates_railway.jar" class="download-link">下载</a>
        </div>
    </div>

    <footer class="footer-bar">
        <div class="footer-content">
            <a href="https://github.com/LrcxzzMC/lrcxzzmc.github.io" target="_blank" class="github-link">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" class="github-icon">
                <span>源码</span>
            </a>
        </div>
    </footer>

    <div class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </div>

    <script>
        // 主题切换：只翻转 data-theme，样式全在 theme.css 里
        document.getElementById('themeToggle').addEventListener('click', function (e) {
            e.preventDefault();
            var root = document.documentElement;
            var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            localStorage.setItem('kicoso-theme', next);
        });

        // 滚动：顶栏收缩 + 回到顶部
        window.addEventListener('scroll', function () {
            var header = document.getElementById('header');
            var backToTop = document.getElementById('backToTop');
            header.classList.toggle('shrink', window.scrollY > 80);
            backToTop.classList.toggle('visible', window.scrollY > 400);
        });

        document.getElementById('backToTop').addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

</body>
</html>
