<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的产品 - Kicoso</title>
    <link rel="icon" href="./webside_icon.png" type="image/png">
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('./font.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'CustomFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #000000;
            color: #ffffff;
            line-height: 1.6;
            padding-top: 80px;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* ===== 导航栏 ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #000000;
            border-bottom: 2px solid #ffffff;
            display: flex;
            align-items: center;
            padding: 12px 5%;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        header.shrink {
            padding: 6px 5%;
            border-bottom-color: #ffaa33;
        }

        .logo {
            display: flex;
            align-items: center;
            margin-right: 40px;
            transition: all 0.3s ease;
        }

        .logo img {
            height: 44px;
            width: auto;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.05));
        }

        header.shrink .logo img {
            opacity: 0;
            width: 0;
            height: 0;
            margin: 0;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-left: 12px;
        }

        .logo-text-default {
            display: inline-block;
        }
        .logo-text-shrink {
            display: none;
        }

        header.shrink .logo-text-default {
            display: none;
        }
        header.shrink .logo-text-shrink {
            display: inline-block;
            margin-left: 0;
            font-size: 20px;
            font-weight: 700;
            color: #ffaa33;
        }

        nav {
            flex-grow: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 4px;
        }

        nav ul li a {
            text-decoration: none;
            color: #999999;
            font-weight: 500;
            font-size: 16px;
            padding: 8px 18px;
            border: 1px solid transparent;
            transition: all 0.25s ease;
        }

        nav ul li a:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.02);
        }

        .btn {
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 8px 18px;
            transition: all 0.25s ease;
            cursor: pointer;
            border: 1px solid;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .kol-btn {
            color: #999999;
            border-color: rgba(255, 255, 255, 0.15);
            background: transparent;
        }

        .kol-btn:hover {
            color: #ffaa33;
            border-color: #ffaa33;
            background: rgba(255, 170, 51, 0.02);
        }

        .theme-btn {
            color: #999999;
            border-color: rgba(255, 255, 255, 0.15);
            background: transparent;
            font-size: 16px;
            padding: 8px 14px;
        }

        .theme-btn:hover {
            color: #3388ff;
            border-color: #3388ff;
            background: rgba(51, 136, 255, 0.02);
        }

        /* ===== 产品内容 ===== */
        .products-content {
            max-width: 1200px;
            margin: 40px auto;
            padding: 40px;
            background: #0a0a0a;
            border: 2px solid #ffffff;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.02);
        }

        .products-content h1 {
            text-align: center;
            color: #ffffff;
            font-size: 2.8rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .products-content h1 span {
            color: #ffaa33;
        }

        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            justify-items: center;
        }

        .product-card {
            background: #0d0d0d;
            border: 2px solid #333333;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            width: 100%;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: #ffffff;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.02);
        }

        .product-card:nth-child(1):hover {
            border-color: #3388ff;
            box-shadow: 0 0 40px rgba(51, 136, 255, 0.02);
        }

        .product-card:nth-child(2):hover {
            border-color: #ffaa33;
            box-shadow: 0 0 40px rgba(255, 170, 51, 0.02);
        }

        .product-card:nth-child(3):hover {
            border-color: #00ffaa;
            box-shadow: 0 0 40px rgba(0, 255, 170, 0.02);
        }

        .product-icon {
            font-size: 50px;
            margin-bottom: 20px;
            display: block;
        }

        .product-card h3 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .product-card p {
            color: #888888;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .download-btn {
            display: inline-block;
            padding: 12px 25px;
            background: transparent;
            color: #ffffff;
            text-decoration: none;
            border: 2px solid #ffffff;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.04);
        }

        .product-card:nth-child(1) .download-btn {
            border-color: #3388ff;
            color: #3388ff;
        }

        .product-card:nth-child(1) .download-btn:hover {
            background: #3388ff;
            color: #000000;
            box-shadow: 0 0 30px rgba(51, 136, 255, 0.04);
        }

        .product-card:nth-child(2) .download-btn {
            border-color: #ffaa33;
            color: #ffaa33;
        }

        .product-card:nth-child(2) .download-btn:hover {
            background: #ffaa33;
            color: #000000;
            box-shadow: 0 0 30px rgba(255, 170, 51, 0.04);
        }

        .product-card:nth-child(3) .download-btn {
            border-color: #00ffaa;
            color: #00ffaa;
        }

        .product-card:nth-child(3) .download-btn:hover {
            background: #00ffaa;
            color: #000000;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.04);
        }

        /* ===== 底部 ===== */
        .footer-bar {
            background: #000000;
            border-top: 2px solid #333333;
            padding: 18px 0;
            width: 100%;
            margin-top: 40px;
        }

        .footer-bar:hover {
            border-top-color: #ffffff;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            color: #888888;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.25s ease;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
        }

        .github-link:hover {
            color: #ffffff;
            border-color: #ffffff;
            transform: translateX(4px);
        }

        .github-icon {
            width: 20px;
            height: 20px;
            filter: invert(1);
            transition: all 0.25s ease;
        }

        .github-link:hover .github-icon {
            filter: invert(1) drop-shadow(0 0 4px rgba(255, 255, 255, 0.1));
        }

        @media (max-width: 768px) {
            header {
                padding: 10px 4%;
                border-bottom-width: 1px;
            }

            .logo-text {
                font-size: 18px;
            }

            nav ul li a {
                font-size: 14px;
                padding: 6px 12px;
                border: none;
            }

            nav ul li a:hover {
                border: none;
            }

            .kol-btn, .theme-btn {
                font-size: 13px;
                padding: 6px 12px;
            }

            header.shrink .logo-text-shrink {
                font-size: 16px;
            }

            .products-content {
                padding: 20px 16px;
                margin: 20px 12px;
                border-width: 1px;
            }

            .products-content h1 {
                font-size: 2rem;
            }

            .products-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .product-card {
                padding: 20px 16px;
                border-width: 1px;
            }

            nav {
                gap: 8px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            nav ul {
                gap: 0;
            }
            nav ul li {
                margin-left: 0;
            }

            .footer-bar {
                border-top-width: 1px;
            }
        }

        @media (max-width: 480px) {
            .logo img {
                height: 32px;
            }

            .logo-text {
                font-size: 15px;
                margin-left: 8px;
            }

            .products-content h1 {
                font-size: 1.6rem;
            }

            nav ul li a {
                font-size: 13px;
                padding: 4px 10px;
            }

            .kol-btn, .theme-btn {
                font-size: 12px;
                padding: 4px 10px;
            }

            header.shrink .logo-text-shrink {
                font-size: 14px;
            }

            .download-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .product-card {
                padding: 16px 12px;
            }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="logo">
            <img src="./kicoso.png" alt="Kicoso Logo">
            <span class="logo-text logo-text-default">kicoso</span>
            <span class="logo-text logo-text-shrink">Kicoso Studios</span>
        </div>
        <nav>
            <ul>
                <li><a href="./index_d.html">首页</a></li>
                <li><a href="./about_d.html">关于</a></li>
            </ul>
            <a href="./kol.html" class="btn kol-btn">📄 协议</a>
            <a href="./products.html" class="btn theme-btn"><i class="fas fa-sun"></i> 浅色</a>
        </nav>
    </header>

    <div class="products-content">
        <h1>我们的 <span>产品</span></h1>

        <div class="products-container">
            <div class="product-card">
                <span class="product-icon">O</span>
                <h3>OdiyaOS Python Re3</h3>
                <p>一款永远不会停更的"操作系统-伪"</p>
                <a href="odiya.html" class="download-btn">版本</a>
            </div>

            <div class="product-card">
                <span class="product-icon">🎮️</span>
                <h3>WabLian World-万联世界</h3>
                <p>MC的多方面整合包</p>
                <a href="./wwlMC.html" class="download-btn">下载整合包</a>
            </div>

            <div class="product-card">
                <span class="product-icon">🎮️</span>
                <h3>各种模组</h3>
                <p>kcs的所有模组都在这里！</p>
                <a href="./MODS.html" class="download-btn">？？？</a>
            </div>
        </div>
    </div>

    <footer class="footer-bar">
        <div class="footer-content">
            <a href="https://github.com/LrcxzzMC/lrcxzzmc.github.io" target="_blank" class="github-link">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" class="github-icon">
                <span>源码</span>
            </a>
        </div>
    </footer>

    <script>
        window.addEventListener('scroll', function() {
            const header = document.getElementById('header');
            if (window.scrollY > 100) {
                header.classList.add('shrink');
            } else {
                header.classList.remove('shrink');
            }
        });
    </script>

</body>
</html>
