<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森罗附属-老牌酒馆</title>
    <link rel="icon" href="./website_icon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./theme.css">
    <script>
        // 主题初始化：优先读记忆，默认浅色（放在 head 里避免闪烁）
        (function () {
            var saved = localStorage.getItem('kicoso-theme');
            document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <style>
        /* 本页专属：像素风版本清单（等宽字体 + 主题令牌配色） */
        @font-face {
            font-family: 'PixelFont';
            src: url('./font.ttf') format('truetype');
        }

        * {
            font-family: 'PixelFont', 'Courier New', monospace;
        }

        .tavern-container {
            max-width: 740px;
            width: calc(100% - 40px);
            margin: 40px auto;
            padding: 30px;
            background: var(--panel-bg);
            border: var(--panel-border);
            border-radius: var(--radius-panel);
            box-shadow: var(--panel-shadow);
        }

        .tavern-header {
            text-align: center;
            padding: 24px 0 20px;
            border-bottom: var(--section-border);
            margin-bottom: 30px;
        }

        .tavern-header h1 {
            font-size: 2rem;
            font-weight: 400;
            color: var(--h1-color);
            letter-spacing: 4px;
        }

        .tavern-header h1 span {
            color: var(--h1-span);
        }

        html[data-theme="dark"] .tavern-header h1 span {
            color: var(--accent-a);
        }

        .tavern-header .sub {
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 4px;
            margin-top: 4px;
        }

        .version-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            margin-bottom: 8px;
            background: var(--card-bg);
            border: var(--card-border);
            border-radius: var(--radius-card);
            transition: all 0.3s ease;
        }

        .version-item:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent-orange);
            transform: translateX(4px);
        }

        html[data-theme="dark"] .version-item:hover {
            border-color: var(--accent-a);
        }

        .version-item .name {
            color: var(--text);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .version-item .name .ver {
            color: var(--accent-orange);
        }

        html[data-theme="dark"] .version-item .name .ver {
            color: var(--accent-a);
        }

        .version-item .download-link {
            color: var(--btn-color);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 4px 16px;
            border: 1px solid var(--btn-border);
            border-radius: var(--radius-pill);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .version-item .download-link:hover {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        html[data-theme="dark"] .version-item .download-link:hover {
            border-color: var(--accent-a);
            color: var(--accent-a);
        }

        @media (max-width: 600px) {
            .version-item {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
                text-align: center;
            }
            .tavern-header h1 { font-size: 1.5rem; letter-spacing: 2px; }
            .version-item .name { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="logo">
            <img src="./kicoso.png" alt="Kicoso Logo">
            <span class="logo-text logo-text-default">kicoso</span>
            <span class="logo-text logo-text-shrink">Kicoso Studios</span>
        </div>
        <nav>
            <ul>
                <li><a href="./index.html">首页</a></li>
                <li><a href="./products.html">我们的产品</a></li>
            </ul>
            <a href="#" id="themeToggle" class="btn theme-btn">
                <span class="t-dark"><i class="fas fa-moon"></i> 深色</span>
                <span class="t-light"><i class="fas fa-sun"></i> 浅色</span>
            </a>
        </nav>
    </header>

    <div class="tavern-container">
        <div class="tavern-header">
            <h1>森罗附属-<span>老牌酒馆</span></h1>
            <div class="sub">// 版本清单</div>
        </div>

        <div class="version-item">
            <span class="name"><span class="ver">kaletaold 1.0.0</span>  ·  初始酿造</span>
            <a href="https://github.com/LrcxzzMC/Kaleidoscope-Old-Tavern/releases/download/Rel/kaletaold-1.0.0.jar" class="download-link">取酒</a>
        </div>
    </div>

    <footer class="footer-bar">
        <div class="footer-content">
            <a href="https://github.com/LrcxzzMC/lrcxzzmc.github.io" target="_blank" class="github-link">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" class="github-icon">
                <span>源码</span>
            </a>
        </div>
    </footer>

    <div class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </div>

    <script>
        // 主题切换：只翻转 data-theme，样式全在 theme.css 里
        document.getElementById('themeToggle').addEventListener('click', function (e) {
            e.preventDefault();
            var root = document.documentElement;
            var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            localStorage.setItem('kicoso-theme', next);
        });

        // 滚动：顶栏收缩 + 回到顶部
        window.addEventListener('scroll', function () {
            var header = document.getElementById('header');
            var backToTop = document.getElementById('backToTop');
            header.classList.toggle('shrink', window.scrollY > 80);
            backToTop.classList.toggle('visible', window.scrollY > 400);
        });

        document.getElementById('backToTop').addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

</body>
</html>
