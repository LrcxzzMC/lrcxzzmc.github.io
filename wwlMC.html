<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万联世界 · 版本列表</title>
    <link rel="icon" href="./website_icon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./theme.css">
    <script>
        // 主题初始化：优先读记忆，默认浅色（放在 head 里避免闪烁）
        (function () {
            var saved = localStorage.getItem('kicoso-theme');
            document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <style>
        /* 本页专属：万联世界版本档案（等宽字体 + 主题令牌配色） */
        * {
            font-family: 'Courier New', monospace;
        }

        .wwl-container {
            max-width: 820px;
            width: calc(100% - 40px);
            margin: 40px auto;
            padding: 30px;
            background: var(--panel-bg);
            border: var(--panel-border);
            border-radius: var(--radius-panel);
            box-shadow: var(--panel-shadow);
        }

        .wwl-header {
            text-align: center;
            padding: 20px 0 10px;
            border-bottom: var(--section-border);
            margin-bottom: 30px;
        }

        .wwl-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--h1-color);
            letter-spacing: 4px;
        }

        .wwl-header h1 span {
            color: var(--h1-span);
        }

        html[data-theme="dark"] .wwl-header h1 span {
            color: var(--accent-a);
        }

        .wwl-header .sub {
            color: var(--muted);
            font-size: 0.85rem;
            letter-spacing: 6px;
            margin-top: 4px;
        }

        .version-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            margin-bottom: 10px;
            background: var(--card-bg);
            border: var(--card-border);
            border-radius: var(--radius-card);
            transition: all 0.3s ease;
        }

        .version-item:hover {
            background: var(--card-hover-bg);
            transform: translateX(6px);
        }

        html:not([data-theme="dark"]) .version-item:nth-child(3n+1):hover {
            border-color: var(--accent);
        }

        html:not([data-theme="dark"]) .version-item:nth-child(3n+2):hover {
            border-color: var(--accent-orange);
        }

        html:not([data-theme="dark"]) .version-item:nth-child(3n):hover {
            border-color: var(--accent-green);
        }

        html[data-theme="dark"] .version-item:hover {
            border-color: #ffffff;
        }

        .version-item .name {
            color: var(--text);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .version-item .name .ver {
            color: var(--accent);
            font-weight: 600;
        }

        html[data-theme="dark"] .version-item .name .ver {
            color: var(--accent-b);
        }

        .version-item .download-link {
            color: var(--btn-color);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 5px 18px;
            border: 1px solid var(--btn-border);
            border-radius: var(--radius-pill);
            transition: all 0.3s ease;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .version-item .download-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        html[data-theme="dark"] .version-item .download-link:hover {
            border-color: var(--accent-a);
            color: var(--accent-a);
        }

        @media (max-width: 600px) {
            .version-item {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
                text-align: center;
            }
            .wwl-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="logo">
            <img src="./kicoso.png" alt="Kicoso Logo">
            <span class="logo-text logo-text-default">kicoso</span>
            <span class="logo-text logo-text-shrink">Kicoso Studios</span>
        </div>
        <nav>
            <ul>
                <li><a href="./index.html">首页</a></li>
                <li><a href="./products.html">我们的产品</a></li>
            </ul>
            <a href="#" id="themeToggle" class="btn theme-btn">
                <span class="t-dark"><i class="fas fa-moon"></i> 深色</span>
                <span class="t-light"><i class="fas fa-sun"></i> 浅色</span>
            </a>
        </nav>
    </header>

    <div class="wwl-container">
        <div class="wwl-header">
            <h1><span>WABLIAN WORLD</span></h1>
            <div class="sub">// 万联世界 · 版本档案</div>
        </div>

        <div class="version-item">
            <span class="name"><span class="ver">ALPHA</span>  ·  最初之章</span>
            <a href="https://www.123865.com/s/pFvgTd-kbgtd" class="download-link">获取</a>
        </div>
        <div class="version-item">
            <span class="name"><span class="ver">0.2</span>  ·  稳定版（也许）</span>
            <a href="https://www.123865.com/s/pFvgTd-NVgtd" class="download-link">获取</a>
        </div>
        <div class="version-item">
            <span class="name"><span class="ver">0.7</span>  ·  高级版 · 任务系统</span>
            <a href="https://www.123865.com/s/pFvgTd-fAFtd" class="download-link">获取</a>
        </div>
        <div class="version-item">
            <span class="name"><span class="ver">1.07</span>  ·  bug修复 · 抽象加载画面</span>
            <a href="https://www.123865.com/s/pFvgTd-tEFtd" class="download-link">获取</a>
        </div>
        <div class="version-item">
            <span class="name"><span class="ver">1.9</span>  ·  迭代里程碑</span>
            <a href="https://cdn.bbsmc.net/bbsmc/data/KsXOljsN/versions/a1G7cT6n/WWLMC-1.9.zip" class="download-link">获取</a>
        </div>
        <div class="version-item">
            <span class="name"><span class="ver">1.98</span>  ·  接近完美</span>
            <a href="https://www.123865.com/s/pFvgTd-NCFtd" class="download-link">获取</a>
        </div>
        <div class="version-item">
            <span class="name"><span class="ver">2.2.1</span>  ·  bug修复</span>

        </div>
    </div>

    <footer class="footer-bar">
        <div class="footer-content">
            <a href="https://github.com/LrcxzzMC/lrcxzzmc.github.io" target="_blank" class="github-link">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub" class="github-icon">
                <span>源码</span>
            </a>
        </div>
    </footer>

    <div class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </div>

    <script>
        // 主题切换：只翻转 data-theme，样式全在 theme.css 里
        document.getElementById('themeToggle').addEventListener('click', function (e) {
            e.preventDefault();
            var root = document.documentElement;
            var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            localStorage.setItem('kicoso-theme', next);
        });

        // 滚动：顶栏收缩 + 回到顶部
        window.addEventListener('scroll', function () {
            var header = document.getElementById('header');
            var backToTop = document.getElementById('backToTop');
            header.classList.toggle('shrink', window.scrollY > 80);
            backToTop.classList.toggle('visible', window.scrollY > 400);
        });

        document.getElementById('backToTop').addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

</body>
</html>
