    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a12;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 820px;
            width: 100%;
        }

        .header {
            text-align: center;
            padding: 30px 0 10px 0;
            border-bottom: 2px solid #00ffcc;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00ffcc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }

        .header .sub {
            color: #8888aa;
            font-size: 0.85rem;
            letter-spacing: 6px;
            margin-top: 4px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #8888aa;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
            letter-spacing: 2px;
        }

        .back-link:hover {
            color: #00ffcc;
        }

        .version-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-left: 3px solid #a855f7;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .version-item:hover {
            background: rgba(255,255,255,0.06);
            border-left-color: #00ffcc;
            transform: translateX(6px);
        }

        .version-item .name {
            color: #d0d0e0;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .version-item .name .ver {
            color: #a855f7;
            font-weight: 600;
        }

        .version-item .download-link {
            color: #8888aa;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 5px 18px;
            border: 1px solid #333355;
            border-radius: 4px;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .version-item .download-link:hover {
            border-color: #00ffcc;
            color: #00ffcc;
            background: rgba(0,255,204,0.04);
        }

        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            text-align: center;
            color: #555577;
            font-size: 0.75rem;
            letter-spacing: 4px;
        }

        .footer a {
            color: #555577;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #a855f7;
        }

        @media (max-width: 600px) {
            .version-item {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
                text-align: center;
            }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
